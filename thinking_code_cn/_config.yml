# Book settings
title: 思考的代码 ― 约束与优化的冒险
author: <a href="https://www.feng.co.jp" target="_blank">株式会社フォン</a>
email: zhangry@feng.co.jp
copyright: "2024"

# Force re-execution of notebooks on each build.
execute:
  execute_notebooks: off

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

repository:
  url: https://github.com/ruoyu0088/thinking_code
  branch: main
  path_to_book: thinking_code_cn

html:
  use_repository_button: true
  use_issues_button: true

sphinx:
  config:
    site_url: "https://ruoyu0088.github.io/thinking_code/zh/"
    sitemap_url_scheme: "{link}"
    language: zh_CN
    html_js_files:
      - lang-switch.js

  extra_extensions:
   - sphinxcontrib.mermaid
   - sphinx_sitemap
